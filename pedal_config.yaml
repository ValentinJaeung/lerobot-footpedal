device: "/dev/input/by-id/usb-PCsensor_FootSwitch-event-kbd"
grab: true

bindings:
  left:   { code: 30, key: KEY_R }   # pedal sends 'a'
  center: { code: 48, key: KEY_Q }   # pedal sends 'b'
  right:  { code: 46, key: KEY_N }   # pedal sends 'c'

debounce:
  cooldown_s: 0.5
  global_lockout_s: 0.15

double_tap:
  action: center
  window_s: 2.0
